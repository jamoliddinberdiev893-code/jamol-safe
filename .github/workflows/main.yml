name: Build JAMOL SAFE APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Get project files
    uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Create Android project
    shell: bash
    run: |
      mkdir -p app/src/main/java/com/jamol/safe
      mkdir -p app/src/main/assets
      cp index.html app/src/main/assets/index.html

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "JamolSafe"
      include ':app'
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.6.1' apply false
      }
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.jamol.safe'
          compileSdk 35

          defaultConfig {
              applicationId 'com.jamol.safe'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
          }
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:label="JAMOL SAFE">
              <activity
                  android:name=".MainActivity"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>
      </manifest>
      EOF

      cat > app/src/main/java/com/jamol/safe/MainActivity.java <<'EOF'
      package com.jamol.safe;

      import android.app.Activity;
      import android.os.Bundle;
      import android.webkit.WebView;
      import android.webkit.WebSettings;
      import android.webkit.WebViewClient;

      public class MainActivity extends Activity {
          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              setContentView(webView);
              webView.loadUrl("file:///android_asset/index.html");
          }
      }
      EOF

  - name: Build APK
    run: gradle assembleDebug

  - name: Save APK for download
    uses: actions/upload-artifact@v4
    with:
      name: JAMOL-SAFE-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
